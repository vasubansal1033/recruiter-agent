[project]
name = "recruiter-agent"
version = "0.1.0"
description = "Local/hostable recruiter agent for Vasu Bansal — JD in, fit answer out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents[litellm]",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "gradio",
]

[project.scripts]
recruiter-agent = "recruiter_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recruiter_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/recruiter_agent", "profile", "README.md"]

[tool.uv]
package = true
